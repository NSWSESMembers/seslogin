<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Launch without browser chrome when added to an iPad's home screen, which is
         how a kiosk gets a reliable full screen there (see KioskStatusDialog). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iPadOS resolves "black" against the light/dark setting; KioskMain adds a
         theme-color to keep the kiosk's status bar black in both. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="seslogin" />
    <link rel="apple-touch-icon" href="/image/logo.png" />
    <meta name="seslogin-client-version" content="%VITE_CLIENT_VERSION%" />
    <title>seslogin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
