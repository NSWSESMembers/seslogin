<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Launch without browser chrome when added to an iPad's home screen, which is
         how a kiosk gets a reliable full screen there (see KioskStatusDialog). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` rather than `black`/`black-translucent`, so the status bar is never
         see-through: iOS 26+ otherwise blurs the page beneath it. The kiosk's sticky
         title bar then gives the status bar its colour (see ScanTitleBar). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SESLogin" />
    <link rel="apple-touch-icon" href="/image/logo.png" />
    <!-- The manifest deliberately has no `start_url`, so an installed app opens at the
         page it was installed from: a kiosk's key and settings belong to its profile
         (`/kiosk/:profile`), and a fixed start would open every install on the default
         one. `scope` is the whole origin, so the kiosk's links to enrolment, the guide
         or admin stay in the app. The meta tags above stay for older iPadOS. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="seslogin-client-version" content="%VITE_CLIENT_VERSION%" />
    <title>SESLogin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
