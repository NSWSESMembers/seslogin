name: Deploy (test)

on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-2
  DEPLOY_ROLE_ARN: arn:aws:iam::641079927221:role/seslogin-github-deploy

jobs:
  api_check:
    uses: ./.github/workflows/_check-api.yml

  web_check:
    uses: ./.github/workflows/_check-web.yml

  pagination_check:
    uses: ./.github/workflows/_check-pagination.yml

  deploy_api:
    needs: [api_check, web_check, pagination_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust (pinned by api/rust-toolchain.toml)
        uses: ./.github/actions/setup-rust

      - name: Install cargo-lambda
        run: pip install cargo-lambda

      - name: Build API lambda
        working-directory: ./api
        run: cargo lambda build --release --bin lambda

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Functions exist (Terraform-managed with their execution roles); update
      # code only — no --role (avoids needing iam:PassRole).
      - name: Deploy seslogin-test-api
        working-directory: ./api
        run: cargo lambda deploy --binary-name lambda seslogin-test-api

  deploy_web:
    needs: deploy_api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        working-directory: ./web
        run: npm install

      - name: Run relay compiler
        working-directory: ./web
        run: npm run relay

      - name: Build web app
        working-directory: ./web
        env:
          VITE_API_URL: https://test.seslogin.com/graphql
          VITE_BEACON_URL: ${{ vars.BEACON_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_CLIENT_VERSION: ${{ github.sha }}
          VITE_ENVIRONMENT: test
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Upload in three stages so S3 never holds an index.html whose assets are
      # missing: a missing asset is answered with index.html (the SPA fallback
      # turns 403/404 into a 200), which a browser can then cache under the
      # hashed asset URL and load as a script. Old assets are never deleted, so
      # pages still on the old index.html (CloudFront caches it for up to 5
      # minutes) keep working.
      - name: Deploy assets to S3
        run: aws s3 sync --follow-symlinks ./web/dist/assets s3://seslogin-test-web-641079927221/assets

      - name: Deploy other files to S3
        run: aws s3 sync --follow-symlinks --delete --exclude "assets/*" --exclude index.html ./web/dist s3://seslogin-test-web-641079927221

      - name: Deploy index.html to S3
        run: aws s3 cp ./web/dist/index.html s3://seslogin-test-web-641079927221/index.html

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "E3HQAX3Z0AQJDM" --paths "/*"
