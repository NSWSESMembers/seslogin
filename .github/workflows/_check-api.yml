name: API check (reusable)
on:
  workflow_call:

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  api_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The runner image ships SDKs we never use. Clearing them frees ~20GB of
      # headroom for `cargo test`, which links one binary per tests/*.rs file.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Setup Rust (pinned by api/rust-toolchain.toml)
        uses: ./.github/actions/setup-rust
      - name: Create JWT_SECRET
        run: echo "testsecret" > api/jwt_secret.local
      - name: Run rustfmt check
        run: cd api && cargo fmt --check
      - name: Check GraphQL schema is up to date
        run: |
          cd api
          cargo run --locked --bin export-schema > /tmp/schema.generated.graphql
          diff -u schema.graphql /tmp/schema.generated.graphql
      - name: Run Clippy
        run: cd api && cargo clippy --locked --all-targets --all-features
      - name: Run tests
        run: cd api && cargo test --locked
