	updateMapPin(id: ID!, expectedVersion: Int!, title: String, latitude: Float, longitude: Float, address: String, note: String, layerId: ID, type: MapPinType): MapPin!
	"""
	Delete a map pin. Returns its ID.
	"""
	deleteMapPin(id: ID!): ID!
	createMapLayer(locationId: ID!, name: String!): MapLayer!
	renameMapLayer(id: ID!, name: String!): MapLayer!
	"""
	Delete a map layer. Its pins stay on the location's map. Returns its ID.
	"""
	deleteMapLayer(id: ID!): ID!
	"""
	Add an event to a location's calendar, optionally in one of its calendars.
