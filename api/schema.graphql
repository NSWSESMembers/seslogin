	updateEquipmentReservation(id: ID!, expectedVersion: Int!, equipmentIds: [ID!], startTime: Int, endTime: Int, reservedFor: String, description: String): EquipmentReservation!
	"""
	Cancel (delete) a reservation. Returns its ID.
	"""
	deleteEquipmentReservation(id: ID!): ID!
	"""
	Add a pin to a location's shared map, optionally of a `type` (a plain pin
