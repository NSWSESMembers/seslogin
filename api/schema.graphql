	): Category!
	updateCategory(		id: ID!,		name: String!,		enabled: Boolean!,		isVirtual: Boolean!,		nitcGroupId: String,		nitcParticipantType: String,
		"""
		Kiosk group name. Omit to leave unchanged, null (or empty) to clear, or a string to set.
		"""
		groupName: String,
		"""
