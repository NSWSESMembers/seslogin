type MutationRoot {
	authSession(code: String!): String
	"""
	Publish a kiosk's public key as a pending enrollment (public-key/QR flow). The
	kiosk re-submits every ~10 min while unenrolled; an admin then scans the kiosk's
	QR code to complete enrollment via [`enroll_session`]. Returns the server-computed
	key fingerprint (hex SHA-256 of the SPKI DER) that the QR code carries.
	
	Intentionally unauthenticated and cheap to serve: the input is strictly validated
	(must be a well-formed P-256 SPKI ≤200 bytes) and writes are keyed by fingerprint,
	so a flood from one key only ever touches one item. A short-lived record already
	present is not rewritten (write-suppression below).
	"""
	submitEnrollmentKey(publicKey: String!): String!
	"""
	Request an email login code. Always returns true to avoid email enumeration.
	Requires a valid Cloudflare Turnstile token.
	"""
	requestAuthCode(email: String!, turnstileToken: String!): Boolean!
	"""
	Verify an email login code and return an opaque session token on success.
	"""
	verifyAuthCode(email: String!, code: String!): String
	"""
	Revoke the current user's opaque session token (no-op for JWT sessions).
	"""
	logout: Boolean!
	createUser(email: String!, isSuper: Boolean!, locationGrants: [String!]!): User!
	updateUser(id: ID!, email: String!, isSuper: Boolean!, isDev: Boolean!, enabled: Boolean!, locationGrants: [String!]!): User!
	createPerson(locationId: ID!, firstName: String!, lastName: String!, memberNumber: String!): Person!
	updatePerson(id: ID!, firstName: String!, lastName: String!, memberNumber: String!): Person!
	deletePerson(id: ID!): Boolean!
	createPeriod(personId: ID!, locationId: ID!, categoryId: ID!, startTime: Int!, endTime: Int!, comment: String): Period!
	updatePeriod(id: ID!, personId: ID!, locationId: ID!, categoryId: ID!, startTime: Int!, endTime: Int!, comment: String): Period!
	updatePeriodTimeCategory(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!, comment: String): Period!
	"""
	Email the member a reminder to check one of their time entries, with a
	short-lived link that lets them correct it themselves.
	
	Issues a fresh `slp_` token each time, so a member who lost or expired an
	earlier link just needs another press. Returns the address it was sent to
	(useful confirmation for the admin who pressed the button).
	"""
	sendPeriodEditLink(id: ID!): String!
	deletePeriod(id: ID!): Boolean!
	createSession(name: String!, locationId: ID!, config: String, healthcheckUrl: String): Session!
	"""
	Complete a public-key kiosk enrollment: create a session bound to the public key a
	kiosk previously published via [`submit_enrollment_key`], identified by its
	`key_fingerprint`. The kiosk then authenticates every request by signing it (no
	6-digit code, no JWT). Reached from the admin SessionEnroll page after scanning
	the kiosk's QR code.
	"""
	enrollSession(name: String!, locationId: ID!, config: String, healthcheckUrl: String, keyFingerprint: String!): Session!
	createApiToken(name: String!, locationGrants: [String!]!, readOnly: Boolean!, expiresAt: Int): CreateApiTokenResult!
	updateApiToken(id: ID!, name: String!, locationGrants: [String!]!, readOnly: Boolean!, expiresAt: Int): ApiToken!
	revokeApiToken(id: ID!): Boolean!
	updateSession(id: ID!, name: String!, config: String, healthcheckUrl: String): Session!
	deleteSession(id: ID!): Boolean!
	"""
	Bring back a QR-enrolled kiosk that expired after two weeks offline, without
	deleting and re-enrolling it — it keeps its name, config and healthcheck URL.
	Kiosks set up with a 6-digit code cannot be reactivated.
	
	Only succeeds while the kiosk is switched on and showing its enrollment QR screen,
	and only grants a short window: the kiosk must come back with one signed request,
	which restores its normal two-week window. Otherwise the grant simply lapses.
	"""
	reactivateSession(id: ID!): Session!
	createLocation(name: String!, nitcEnabled: Int): Location!
	updateLocation(id: ID!, name: String!, enabled: Boolean!, nitcEnabled: Int, nitcCompleteOnExport: Boolean): Location!
	createCategory(name: String!, isVirtual: Boolean!, nitcGroupId: String, nitcParticipantType: String): Category!
	updateCategory(id: ID!, name: String!, enabled: Boolean!, isVirtual: Boolean!, nitcGroupId: String, nitcParticipantType: String): Category!
	createNitcGroup(id: String, nitcType: String!, nitcTagIds: [Int!]!): NitcGroup!
	updateNitcGroup(id: ID!, nitcType: String!, nitcTagIds: [Int!]!): NitcGroup!
	deleteNitcGroup(id: ID!): Boolean!
	scanRegister2(		memberNumber: String!,
		"""
		Also compute the sign-out quick-pick shortcuts (see RegisterResult.quickPick). Opt-in: it costs extra reads, and a kiosk with the quick-pick screen turned off has no use for them.
		"""
		quickPick: Boolean
	): RegisterResult!
	scanSignOut(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!): Period!
	"""
	Sign in a guest (non-member) at the kiosk. Creates an open period with no
	person and no category, so it never enters per-person views or the NITC export.
	"""
	scanGuestSignIn(name: String!, reason: String): Period!
	"""
	Sign out a guest period from the kiosk. Only closes guest periods (no person,
	no category), so it can never be used to close a member period.
	"""
	scanGuestSignOut(id: ID!): Period!
	enqueueMemberSync(locationId: ID!): Boolean!
	updateMyEmailConfig(dailyLocationIds: [String!]!): User!
	updateMyDisaggregateVirtualPeriods(value: Boolean!): User!
	"""
	Start passkey registration for the authenticated user.
	Returns a JSON challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyRegistration: PasskeyChallenge!
	"""
	Finish passkey registration: verify the browser response and store the credential.
	"""
	finishPasskeyRegistration(challengeId: String!, credentialJson: String!, name: String!): PasskeyInfo!
	"""
	Start a discoverable passkey login (no username required).
	Returns a JSON challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyLogin: PasskeyChallenge!
	"""
	Finish passkey login: verify the browser response and return an opaque session token.
	"""
	finishPasskeyLogin(challengeId: String!, credentialJson: String!): String
	"""
	Rename one of the authenticated user's passkeys.
	"""
	renamePasskey(id: String!, name: String!): PasskeyInfo!
	"""
	Delete one of the authenticated user's passkeys.
	"""
	deletePasskey(id: String!): Boolean!
}

enum NitcExportStatus {
	SYNCED
	PENDING
}

type NitcGroup {
	id: String!
	nitcType: String!
	sesTags: [SesNonIncidentTag!]!
	createdAt: Int
	updatedAt: Int
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type PasskeyChallenge {
	challengeId: String!
	optionsJson: String!
}

"""
Metadata for a stored passkey credential (never returns the private key material).
"""
type PasskeyInfo {
	id: String!
	name: String!
	createdAt: Int!
	lastUsedAt: Int
}

"""
A still-valid pending kiosk enrollment, surfaced to the admin SessionEnroll page so
it can confirm the kiosk is still waiting before showing the enrollment form.
"""
type PendingEnrollmentKey {
	fingerprint: String!
	expiresAt: Int!
}

type Period {
	id: ID!
	personId: ID
	person: Person
	guestName: String
	comment: String
	locationId: ID!
	location: Location!
	categoryId: ID
	category: Category
	startTime: Int!
	endTime: Int
	createdAt: Int
	updatedAt: Int
	signedInSessionId: ID
	"""
	The kiosk session that signed this period in, if recorded. `None` for
	periods with no recorded sign-in session (older or admin-created periods).
	"""
	signedInSession: Session
	signedOutSessionId: ID
	"""
	The kiosk session that signed this period out, if recorded. `None` for
	periods that are still open or were signed out/edited by an admin.
	"""
	signedOutSession: Session
	nitcEventId: String
	nitcExportStatus: NitcExportStatus
}

type PeriodConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [PeriodEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Period!]!
}

"""
An edge in a connection.
"""
type PeriodEdge {
	"""
	The item at the end of the edge
	"""
	node: Period!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

type Person {
	id: ID!
	"""
	this will be "" if missing
	"""
	firstName: String!
	"""
	this will be "" if missing
	"""
	lastName: String!
	"""
	this can be null
	"""
	registrationNumber: String
	"""
	for backwards compatibility
	"""
	memberNumber: String
	"""
	this can be null
	"""
	sesApiPersonId: String
	"""
	this can be null
	"""
	email: String
	deleted: Boolean!
	"""
	Set when member sync has observed this person missing from their location's SES
	payload. They are soft-deleted once the marker ages past the grace window, unless
	a later sync sees them again and clears it.
	"""
	missingSince: Int
	createdAt: Int
	updatedAt: Int
	periods(categories: [ID!], after: String, before: String, first: Int, last: Int): PeriodConnection!
	"""
	The person's most recent period (by start time), or null if they have none.
	"""
	lastPeriod: Period
	"""
	This person's most-frequently-used categories recently, ranked by
	frequency then recency.
	
	Superseded by `scanRegister2`'s `quickPick`, which serves the kiosk
	sign-out screen without a second round trip. Kept for the kiosk clients
	still deployed against it; remove once they have all rolled over.
	"""
	recentCategories(limit: Int): [PersonRecentCategory!]!
}

type PersonRecentCategory {
	category: Category!
	periodCount: Int!
	lastUsedAt: Int!
}

"""
Lightweight result of looking a person up by registration number. Carries only
the values the GSI query already returns, so no additional record fetch is needed.
"""
type PersonRef {
	"""
	The matched person's ID.
	"""
	id: ID!
	"""
	The registration/member number that was looked up.
	"""
	memberNumber: String!
}

type QueryRoot {
	"""
	Build and deployment information about this API server.
	
	Deliberately unauthenticated — the only root field that is. The home page is
	public and has no credentials to query with, but still needs to warn operators
	when the server is pointed at a non-production database. Both values are safe to
	expose: the repository is public, and `isProdDb` is a boolean rather than the raw
	`DB_PREFIX`.
	"""
	environment: Environment!
	user(
		"""
		ID for the user to look up
		"""
		id: ID
	): User!
	location(
		"""
		ID for the location to look up
		"""
		id: ID!
	): Location!
	person(
		"""
		ID for the person to look up
		"""
		id: ID!
	): Person!
	personByRegistrationNumber(
		"""
		Registration/member number to look up
		"""
		memberNumber: String!
	): PersonRef
	period(
		"""
		ID for the period to look up
		"""
		id: ID!
	): Period!
	"""
	The single period the caller's edit-link token grants access to.
	
	This is the entry point for member-facing edit links delivered by SMS/email.
	The `slp_` token in the `Authorization` header *is* the scope, so there is no
	id argument and no other period is reachable — the caller only ever learns
	about the one period their link was issued for.
	"""
	linkedPeriod: Period!
	session(
		"""
		ID for the session to look up
		"""
		id: ID
	): Session!
	refreshToken: String!
	"""
	Look up a pending kiosk enrollment by its key fingerprint (from the QR code).
	Returns `None` if it never existed or has expired — the admin SessionEnroll page
	uses this to tell the operator to rescan.
	"""
	pendingEnrollmentKey(fingerprint: String!): PendingEnrollmentKey
	category(
		"""
		ID for the category to look up
		"""
		id: ID!
	): Category!
	locations: [Location!]!
	users: [User!]!
	categories: [Category!]!
	nitcGroups: [NitcGroup!]!
	nitcGroup(
		"""
		ID for the NITC group to look up
		"""
		id: ID!
	): NitcGroup!
	apiTokens: [ApiToken!]!
	apiToken(id: ID!): ApiToken!
	ses_headquarters: [SesHeadquarters!]!
	ses_nonincident_types: [String!]!
	ses_nonincident_tags: [SesNonIncidentTag!]!
	ses_participant_types: [String!]!
}

"""
Both halves of the kiosk sign-out quick-pick, returned inline by
`scanRegister2` so the kiosk needs no second round trip.

Deliberately has no field arguments: it is built eagerly by the mutation, so
there is nothing to resolve lazily and nothing for a caller to tune.
"""
type QuickPick {
	"""
	Categories recently used at the kiosk's own location.
	"""
	locationCategories: [LocationRecentCategory!]!
	"""
	Categories recently used by the person signing out, at any location.
	"""
	personCategories: [PersonRecentCategory!]!
}

type RegisterResult {
	state: RegisterState!
	period: Period
	"""
	Shortcuts for the sign-out category screen, saving the kiosk a round trip.
	
	Only ever populated when `state` is `SIGN_OUT_PENDING` and the caller asked
	for it via `quickPick: true` — in any other case there is no sign-out screen
	to fill in, and computing it would be wasted reads on the scan path. Null is
	also what a failed build returns, so the kiosk falls back to the full
	category tree rather than failing the scan.
	"""
	quickPick: QuickPick
}

enum RegisterState {
	NOT_FOUND
	SIGNED_IN
	SIGN_OUT_PENDING
}

type SesHeadquarters {
	id: ID!
	sesId: ID!
	name: String
	code: String
	latitude: Float
	longitude: Float
	type: String
	status: String
	zone: SesHeadquarters
}

type SesNonIncidentTag {
	id: String!
	name: String!
	primaryActivityName: String!
}

type Session {
	id: ID!
	lastContact: Int
	clientVersion: String
	"""
	When this kiosk's enrolled key stops authenticating. Null for code-enrolled kiosks.
	"""
	keyExpiresAt: Int
	name: String!
	locationId: ID!
	location: Location!
	code: String
	healthcheckUrl: String
	config: JSON!
	"""
	True for a kiosk set up through the QR / public-key flow, false for one set up
	with a 6-digit code. Only the former can be reactivated once it expires.
	"""
	keyEnrolled: Boolean!
	"""
	Hex SHA-256 of the kiosk's enrolled public key (SPKI DER), or null for a kiosk set
	up with a 6-digit code. The kiosk shows the same value under its enrollment QR
	code, so an admin can check they are reactivating the device in front of them.
	"""
	keyFingerprint: String
	"""
	Whether `reactivateSession` would succeed right now: a QR-enrolled kiosk that has
	expired *and* is currently switched on showing its enrollment QR screen. Drives the
	Reactivate button in the admin kiosk list, so it is only offered when it will work.
	"""
	reactivatable: Boolean!
	createdAt: Int
	updatedAt: Int
}

type User {
	id: ID!
	email: String!
	"""
	defaults to false if missing
	"""
	isSuper: Boolean!
	isDev: Boolean!
	enabled: Boolean!
	disaggregateVirtualPeriods: Boolean!
	accessTime: Int
	createdAt: Int!
	updatedAt: Int!
	emailSummaryLocationIds: [String!]!
	locationGrantIds: [ID!]!
	locations: [Location!]!
	passkeys: [PasskeyInfo!]!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
