type QueryRoot {
	"""
	Build and deployment information about this API server.
	
	Deliberately unauthenticated — the only root field that is. The home page is
	public and has no credentials to query with, but still needs to warn operators
	when the server is pointed at a non-production database. Both values are safe to
	expose: the repository is public, and `isProdDb` is a boolean rather than the raw
	`DB_PREFIX`.
	"""
	environment: Environment!
	user(
		"""
		ID for the user to look up
		"""
		id: ID
	): User!
	location(
		"""
		ID for the location to look up
		"""
		id: ID!
	): Location!
	person(
		"""
		ID for the person to look up
		"""
		id: ID!
	): Person!
	"""
	The person with this member number, or null if there is none *or* the caller
	cannot read the person's home location, so it cannot be used to probe for member
	numbers at other units. Kiosk sign-in doesn't use this: `scanRegister2` looks the
	number up itself, which is what lets members sign in away from their own unit.
	"""
	personByRegistrationNumber(
		"""
		Registration/member number to look up
		"""
		memberNumber: String!
	): PersonRef
	period(
		"""
		ID for the period to look up
		"""
		id: ID!
	): Period!
	"""
	The single period the caller's edit-link token grants access to.
	
	This is the entry point for member-facing edit links delivered by SMS/email.
	The `slp_` token in the `Authorization` header *is* the scope, so there is no
	id argument and no other period is reachable — the caller only ever learns
	about the one period their link was issued for.
	"""
	linkedPeriod: Period!
	"""
	The signed-in user's own sign-in state at their linked member's home unit,
	for the Tally app; null when no (live) member is linked to the account. Users
	only: a kiosk, API token or edit link is refused. No location grant is
	needed — the link is the authority (see `graphql::self_sign_in`).
	"""
	selfSignInStatus: SelfSignInStatus
	"""
	One task, open or completed; null if it does not exist or was deleted.
	"""
	task(id: ID!): Task
	"""
	One note; null if it does not exist or was deleted.
	"""
	note(id: ID!): Note
	"""
	One piece of equipment; null if it does not exist or was deleted.
	"""
	equipment(id: ID!): Equipment
	"""
	One equipment reservation; null if it does not exist or was deleted.
	"""
	equipmentReservation(id: ID!): EquipmentReservation
	"""
	One map pin; null if it does not exist or was deleted.
	"""
	mapPin(id: ID!): MapPin
	"""
	One calendar event; null if it does not exist or was deleted.
	"""
	calendarEvent(id: ID!): CalendarEvent
	"""
	One on-call role; null if it does not exist or was deleted.
	"""
	onCallRole(id: ID!): OnCallRole
	session(
		"""
		ID for the session to look up
		"""
		id: ID
	): Session!
	"""
	A signed Ably token request scoped to exactly this kiosk's own
	location channel (`kiosk:<db_prefix>:<location_id>`, subscribe-only).
	The location comes from the caller's own session record, never from an
	argument, and the capability is covered by the MAC, so a kiosk cannot
	widen it to another location's channel. Hand
	`tokenRequest` straight to ably-js's `authCallback`.
	
	`None` means realtime publishing is disabled server-side (no
	`ABLY_API_KEY` configured); the kiosk should fall back to polling.
	"""
	kioskRealtimeToken: KioskRealtimeToken
	"""
	A signed Ably token request, subscribe-only, for the enrollment channel
	(`kiosk-enroll:<db_prefix>:<fingerprint>`) of a kiosk waiting to be
	enrolled, so it is told `enrollment.completed` instead of polling.
	
	Unauthenticated — the kiosk has no credentials yet. The fingerprint is
	derived server-side from the validated `publicKey` (never accepted from
	the caller), and a live pending enrollment for it must exist (i.e. the
	kiosk has already called `submitEnrollmentKey`), otherwise this errors.
	That gate stops anyone minting Ably tokens for arbitrary channels: you can
	only get one for a key that has a live pending enrollment, and it grants
	only the content-free signal for that one key.
	
	`None` means realtime is disabled server-side; the kiosk should poll.
	"""
	enrollmentRealtimeToken(publicKey: String!): KioskRealtimeToken
	"""
	Whether `submitFeedback` can send anything: Toolbox is configured on this
	server (`TOOLBOX_GRAPHQL_URL` and `TOOLBOX_API_TOKEN`). The help page
	checks this before showing its form, so nobody types a message only to
	have it refused.
	"""
	feedbackAvailable: Boolean!
	"""
	Look up a pending kiosk enrollment by its key fingerprint (from the QR code).
	Returns `None` if it never existed or has expired — the admin SessionEnroll page
	uses this to tell the operator to rescan.
	
	Deliberately says nothing about the kiosk this device may already be enrolled as:
	scanning a QR code is not a lookup tool for another location's kiosks.
	"""
	pendingEnrollmentKey(fingerprint: String!): PendingEnrollmentKey
	category(
		"""
		ID for the category to look up
		"""
		id: ID!
	): Category!
	locations: [Location!]!
	"""
	The audit log across every location, newest first, with each write listed once —
	including writes to global records (users, categories, API tokens, …) that belong
	to no location. Super users only; location admins use `Location.auditLog`.
	"""
	auditLog(		first: Int,		after: String,		last: Int,		before: String,
		"""
		Only entries about this kind of record
		"""
		entityType: AuditEntityType @deprecated(reason: "Use `entityTypes`"),
		"""
		Only entries about any of these kinds of record. Omitted or empty means every kind
		"""
		entityTypes: [AuditEntityType!]
	): AuditEntryConnection!
	users: [User!]!
	categories: [Category!]!
	nitcGroups: [NitcGroup!]!
	nitcGroup(
		"""
		ID for the NITC group to look up
		"""
		id: ID!
	): NitcGroup!
	apiTokens: [ApiToken!]!
	apiToken(id: ID!): ApiToken!
	ses_headquarters: [SesHeadquarters!]!
	ses_nonincident_types: [String!]!
	ses_nonincident_tags: [SesNonIncidentTag!]!
	ses_participant_types: [String!]!
	"""
	Look up an OAuth client + redirect URI before showing the consent
	screen. Deliberately returns nothing about the client beyond its
	(self-claimed, DCR is unauthenticated) name and the redirect host — the
	consent page shows the host prominently precisely because the name alone
	can't be trusted.
	"""
	oauthAuthorizationRequest(clientId: String!, redirectUri: String!): OauthAuthorizationRequest!
}

"""
Both halves of the kiosk sign-out quick-pick, returned inline by
`scanRegister2` so the kiosk needs no second round trip.

Deliberately has no field arguments: it is built eagerly by the mutation, so
there is nothing to resolve lazily and nothing for a caller to tune.
"""
type QuickPick {
	"""
	Categories recently used at the kiosk's own location.
	"""
	locationCategories: [LocationRecentCategory!]!
	"""
	Categories recently used by the person signing out, at any location.
	"""
	personCategories: [PersonRecentCategory!]!
}

type RegisterResult {
	state: RegisterState!
	period: Period
	"""
	Shortcuts for the sign-out category screen, saving the kiosk a round trip.
	
	Only ever populated when `state` is `SIGN_OUT_PENDING` and the caller asked
	for it via `quickPick: true` — in any other case there is no sign-out screen
	to fill in, and computing it would be wasted reads on the scan path. Null is
	also what a failed build returns, so the kiosk falls back to the full
	category tree rather than failing the scan.
	"""
	quickPick: QuickPick
	"""
	Who the member number belongs to. Only populated when `state` is
	`CONFIRM_VISITOR`; otherwise read it from `period.person`.
	"""
	person: Person
	"""
	Badges to celebrate on this sign-in: everything the member has earned and not
	yet seen. Empty unless the kiosk, its location and the member's home location
	all have gamification on, and always empty for a sign-out pending.
	"""
	awardedBadges: [BadgeAward!]!
}

enum RegisterState {
	NOT_FOUND
	SIGNED_IN
	SIGN_OUT_PENDING
	"""
	The member belongs to another unit and would have been signed in here, but
	the kiosk asked to confirm that first (`confirmVisitor`). Nothing was
	written; `person` says who the number belongs to.
	"""
	CONFIRM_VISITOR
}

type ScanSignOutResult {
	period: Period!
	"""
	Badges to celebrate on this sign-out; see `RegisterResult.awardedBadges`.
	"""
	awardedBadges: [BadgeAward!]!
}

"""
A signed-in user's own sign-in state at their linked member's home unit.
"""
type SelfSignInStatus {
	"""
	The linked member.
	"""
	person: Person!
	"""
	The member's home unit; sign-ins happen here.
	"""
	location: Location!
	"""
	The member's newest open period at the home unit; null when signed out. A
	period open at another unit is not shown.
	"""
	openPeriod: Period
	"""
	The same sign-out shortcuts a kiosk gets. Only computed when selected; null
	if they could not be built.
	"""
	quickPick: QuickPick
	"""
	Everyone currently signed in at the member's home unit (open, not deleted
	periods, members and guests), oldest sign-in first. Computed only when selected.
	"""
	whosHere: [WhosHereEntry!]!
}

type SesHeadquarters {
	id: ID!
	sesId: ID!
	name: String
	code: String
	latitude: Float
	longitude: Float
	type: String
	status: String
	zone: SesHeadquarters
}

type SesNonIncidentTag {
	id: String!
	name: String!
	primaryActivityName: String!
}

type Session {
	id: ID!
	lastContact: Int
	"""
	Increases whenever an admin changes this session or its key is released or it
	is deleted — not on heartbeats. Lets a kiosk tell a stale realtime message or
	refetch from a fresh one.
	"""
	version: Int!
	clientVersion: String
	"""
	What this kiosk last reported about itself. Null for one that has never reported —
	an old client, or a kiosk that has not authenticated since this was deployed.
	"""
	clientInfo: SessionClientInfo
	"""
	When this kiosk's enrolled key stops authenticating. Null once its key was released.
	"""
	keyExpiresAt: Int
	name: String!
	locationId: ID!
	location: Location!
	healthcheckUrl: String
	config: JSON!
	"""
	Whether this kiosk holds an enrolled key. False only for a leftover whose key was
	released (see `keyReleasedAt`), and for a kiosk once set up with the removed
	6-digit code that was never converted — neither can authenticate.
	"""
	keyEnrolled: Boolean!
	"""
	When this kiosk's key was released because its device was set up again by scanning
	its QR code, which moved the key onto a new kiosk entry. Non-null only for such a
	leftover: it no longer authenticates, can never come back online, and is safe to
	delete. Null for every working kiosk.
	"""
	keyReleasedAt: Int
	"""
	Hex SHA-256 of the kiosk's enrolled public key (SPKI DER), or null once its key
	was released. The kiosk shows the same value under its enrollment QR
	code, so an admin can check they are reactivating the device in front of them.
	"""
	keyFingerprint: String
	"""
	Whether `reactivateSession` would succeed right now: a QR-enrolled kiosk that has
	expired *and* is currently switched on showing its enrollment QR screen. Drives the
	Reactivate button in the admin kiosk list, so it is only offered when it will work.
	"""
	reactivatable: Boolean!
	createdAt: Int
	updatedAt: Int
}

type SessionClientInfo {
	"""
	Build channel the client was deployed from: `prod`, `preprod`, `qa`, `test` or
	`dev`. Worth watching: `preprod` and `qa` builds run against the production
	database, so a kiosk reporting either is on live data from a non-prod front-end.
	"""
	env: String
	"""
	The origin the client was actually loaded from, e.g. `https://new.seslogin.com`.
	Unlike `env` this can't be stale or misconfigured at build time.
	"""
	origin: String
	"""
	The GraphQL endpoint the client believes it is talking to. A mismatch against
	`origin` means a front-end pointed at another environment's API.
	"""
	apiUrl: String
	"""
	Kiosk profile from the `/kiosk/:profile` route — which stored identity a shared
	device is running under.
	"""
	profile: String
	"""
	Browser and OS, taken from the request's `User-Agent` rather than self-reported.
	"""
	userAgent: String
	"""
	Viewport as `<width>x<height>@<devicePixelRatio>`.
	"""
	screen: String
	"""
	`standalone`, `fullscreen`, `minimal-ui` or `browser` — whether the kiosk is
	installed as intended or running in a normal browser tab.
	"""
	displayMode: String
	"""
	IANA zone name the client's browser is set to.
	"""
	timezone: String
	"""
	Client clock minus server clock, in seconds; negative means the client is behind.
	A large value predicts signed-key auth failures, whose timestamp window this
	breaks before anything else does.
	"""
	clockSkewSecs: Int
	"""
	Seconds since the client page loaded. A kiosk whose uptime keeps resetting is
	reloading or crash-looping.
	"""
	uptimeSecs: Int
	"""
	A newer build the client has seen but not yet reloaded into — the reason a
	`clientVersion` can look stale on a perfectly healthy kiosk.
	"""
	pendingVersion: String
	"""
	Failed server contacts since the page loaded.
	"""
	contactFailures: Int
	"""
	When this snapshot was written, in Unix seconds.
	"""
	updatedAt: Int
}

"""
`submitFeedback`'s result: the Toolbox ticket the feedback became.
"""
type SubmittedFeedback {
	"""
	Toolbox's ticket number.
	"""
	number: Int!
	"""
	`[#{slug}-{number}]`, the tag on every email about this ticket — what the
	user will see in their inbox, so it doubles as their reference.
	"""
	reference: String!
}

type Task {
	id: ID!
	"""
	One line.
	"""
	title: String!
	description: String
	locationId: ID!
	location: Location!
	"""
	The list the task is on, if any. Null too when that list has been deleted:
	the task then just belongs to its location.
	"""
	list: TaskList
	"""
	The day the task is due (`YYYY-MM-DD`, Sydney), if it has one. A recurring
	task always does.
	"""
	dueDate: String
	"""
	The day the task starts showing in the Due view: its due date, or the day it
	was created.
	"""
	showDate: String!
	"""
	The first day the task counts as overdue: the day after it is due, or a full
	week after for a task that repeats in weeks. Null when it has no due date.
	"""
	overdueFrom: String
	"""
	Whether the task is open and overdue today (Sydney).
	"""
	overdue: Boolean!
	recurrence: TaskRecurrence
	"""
	False once a non-recurring task is completed, or any task deleted. A
	recurring task stays open.
	"""
	open: Boolean!
	"""
	Bumped by every change; pass it back to `updateTask` / `completeTask`.
	"""
	version: Int!
	createdAt: Int!
	"""
	Email of the user who created the task.
	"""
	createdBy: String
	updatedAt: Int!
	"""
	When a non-recurring task was completed.
	"""
	completedAt: Int
	completedBy: String
	"""
	When a recurring task was last completed.
	"""
	lastCompletedAt: Int
	lastCompletedBy: String
}

type TaskList {
	id: ID!
	name: String!
	locationId: ID!
	location: Location!
	createdAt: Int!
}

"""
Once completed, a recurring task is due again `every` days or weeks later,
counted from the day it was completed.
"""
type TaskRecurrence {
	every: Int!
	unit: TaskRecurrenceUnit!
}

input TaskRecurrenceInput {
	"""
	1 to 365.
	"""
	every: Int!
	unit: TaskRecurrenceUnit!
}

enum TaskRecurrenceUnit {
	DAYS
	WEEKS
}

"""
Which of a location's open tasks to list.
"""
enum TaskView {
	"""
	Showing today or earlier: what needs doing now, overdue first.
	"""
	DUE
	"""
	Showing only from a later day, soonest first.
	"""
	SCHEDULED
}

type User {
	id: ID!
	email: String!
	"""
	defaults to false if missing
	"""
	isSuper: Boolean!
	isDev: Boolean!
	enabled: Boolean!
	disaggregateVirtualPeriods: Boolean!
	accessTime: Int
	createdAt: Int!
	updatedAt: Int!
	emailSummaryLocationIds: [String!]!
	"""
	Locations this user has opted into the weekly badge digest email for.
	See `badge_digest.rs`'s `weekly_badge_opted_in_location_ids`, which
	reads the same `email_config` shape — keep them in sync.
	"""
	badgeWeeklyDigestLocationIds: [String!]!
	locationGrantIds: [ID!]!
	"""
	Locations where the user is Read only (can view but not change).
	"""
	readOnlyLocationGrantIds: [ID!]!
	"""
	The member this user acts as when signing in or out from the mobile app.
	"""
	personId: ID
	"""
	The member this user acts as, or null if none is set or it no longer exists.
	"""
	person: Person
	locations: [Location!]!
	passkeys: [PasskeyInfo!]!
	"""
	This user's connected apps (OAuth grants) — the "Connected apps"
	list. Only the user themselves or a super user may see it, same as
	`user(id)`. Filters out anything already past its TTL (DynamoDB's
	deletion lags behind expiry), newest first.
	"""
	oauthGrants: [OauthGrant!]!
}

"""
One open sign-in at the unit, as the kiosk's Who's here list shows it. Deliberately
narrow: no guest reason, member number or other period fields.
"""
type WhosHereEntry {
	"""
	The period id.
	"""
	id: ID!
	"""
	"First Last" for a member, the guest's name for a guest ("Guest" if blank).
	"""
	name: String!
	guest: Boolean!
	"""
	Unix seconds.
	"""
	startTime: Int!
	"""
	This is the caller's linked member's own period.
	"""
	isMe: Boolean!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
