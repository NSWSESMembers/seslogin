	updateNitcGroup(id: ID!, nitcType: String!, nitcTagIds: [Int!]!): NitcGroup!
	deleteNitcGroup(id: ID!): Boolean!
	scanRegister2(		memberNumber: String!,
		"""
		Also compute the sign-out quick-pick shortcuts (see RegisterResult.quickPick). Opt-in: it costs extra reads, and a kiosk with the quick-pick screen turned off has no use for them.
		"""
		quickPick: Boolean,
		"""
		Before signing in a member whose home unit isn't this kiosk's location, return `CONFIRM_VISITOR` instead and write nothing, so the kiosk can check a mistyped number isn't about to sign in the wrong person. The kiosk repeats the call without it once they confirm. Has no effect on a sign-out, which shows the member's name before anything is written.
		"""
		confirmVisitor: Boolean
	): RegisterResult!
