	updateCalendarEvent(id: ID!, expectedVersion: Int!, calendarId: ID, title: String, description: String, allDay: Boolean, startTime: Int, endTime: Int, startDate: String, endDate: String, repeat: EventRepeat, repeatUntil: String): CalendarEvent!
	"""
