type Location {
	id: ID!
	name: String!
	enabled: Boolean!
	nitcEnabled: Int
	"""
	Whether NITC events exported for this location are marked completed in SES.
	"""
	nitcCompleteOnExport: Boolean!
	sesApiHeadquartersId: String
	lastSuccessfulMemberSync: Int
	createdAt: Int!
	updatedAt: Int!
	people: [Person!]!
	"""
	This location's most-frequently-used categories recently, ranked by
	frequency then recency, with the people who most recently used each one.
	
	Superseded by `scanRegister2`'s `quickPick`, which serves the kiosk
	sign-out screen without a second round trip. Kept for the kiosk clients
	still deployed against it; remove once they have all rolled over.
	"""
	recentCategories(limit: Int): [LocationRecentCategory!]!
	periods(onlyActive: Boolean, startTime: Int, endTime: Int, after: String, before: String, first: Int, last: Int): PeriodConnection!
	periodSummaryByMember(startTime: Int!, endTime: Int!, categories: [ID!]): [MemberPeriodSummary!]!
	periodSummaryByCategory(startTime: Int!, endTime: Int!): [CategoryPeriodSummary!]!
	periodSummaryByMemberByCategory(startTime: Int!, endTime: Int!): [MemberCategoryPeriodSummary!]!
	periodSummaryByCategoryByMember(startTime: Int!, endTime: Int!): [CategoryMemberPeriodSummary!]!
	periodSummaryByDayByCategoryByMember(startTime: Int!, endTime: Int!): [DayCategoryPeriodSummary!]!
	"""
	Per-day, per-member activity for this location, used to power the
	attendance heatmap. Unlike `period_summary_by_day_by_category_by_member`,
	this counts every period regardless of whether it has a category, and
	counts still-open periods towards `period_count` (though not
	`total_time`) so an in-progress check-in still shows up as activity
	for today. Days are returned in ascending order (the natural order for
	a left-to-right time series), unlike the descending order used by the
	other day-bucketed resolver.
	"""
	periodSummaryByDayByMember(startTime: Int!, endTime: Int!, categories: [ID!]): [DayMemberPeriodSummary!]!
	sessions: [Session!]!
	dashboardSummary(asOf: Int): LocationDashboardSummary!
}

