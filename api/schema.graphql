	submitFeedback(subject: String!, message: String!): SubmittedFeedback!
	updateMyEmailConfig(dailyLocationIds: [String!]!, weeklyBadgeLocationIds: [String!]): User!
	updateMyDisaggregateVirtualPeriods(value: Boolean!): User!
