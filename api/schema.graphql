	reactivateSession(id: ID!): Session!
	createLocation(name: String!, nitcEnabled: Int): Location!
	updateLocation(id: ID!, name: String!, enabled: Boolean!, nitcEnabled: Int, nitcCompleteOnExport: Boolean, gamificationEnabled: Boolean): Location!
	createCategory(		name: String!,		isVirtual: Boolean!,		nitcGroupId: String,		nitcParticipantType: String,
		"""
		Kiosk group the category appears under, e.g. "Training".
