type MutationRoot {
	"""
	Publish a kiosk's public key as a pending enrollment (public-key/QR flow). The
	kiosk re-submits every ~10 min while unenrolled; an admin then scans the kiosk's
	QR code to complete enrollment via [`enroll_session`]. Returns the server-computed
	key fingerprint (hex SHA-256 of the SPKI DER) that the QR code carries.
	
	Intentionally unauthenticated and cheap to serve: the input is strictly validated
	(must be a well-formed P-256 SPKI ≤200 bytes) and writes are keyed by fingerprint,
	so a flood from one key only ever touches one item. A short-lived record already
	present is not rewritten (write-suppression below).
	"""
	submitEnrollmentKey(publicKey: String!): String!
	"""
	Email a Tally sign-in code, if that email can sign in to Tally (see
	`tally_sign_in`). Always returns true to avoid email enumeration. Requires a
	valid Cloudflare Turnstile token.
	"""
	requestTallySignInCode(email: String!, turnstileToken: String!): Boolean!
	"""
	Redeem a Tally sign-in code and authorize the app that opened the sign-in page,
	returning the URL (its redirect, with `code` and `state`) to send the browser
	to. Fails the same way for any wrong, expired or used-up code.
	"""
	completeTallySignIn(email: String!, code: String!, request: TallyAuthorizationInput!): String!
	"""
	Redeem a Tally sign-in code. With `canSavePasskey` (the browser can make a
	passkey), someone with no passkey yet is offered one first: the answer is a
	`passkeyTicket` instead of the `redirectUrl`. Fails as `completeTallySignIn`
	does for a wrong code.
	"""
	redeemTallySignInCode(email: String!, code: String!, request: TallyAuthorizationInput!, canSavePasskey: Boolean!): TallySignInStep!
	"""
	Start saving a passkey with a sign-in ticket from `redeemTallySignInCode`:
	the user's who signed in, else the member's. Returns the options for
	`navigator.credentials.create`.
	"""
	beginTallyPasskeyRegistration(ticket: String!): PasskeyChallenge!
	"""
	Finish saving a passkey with a sign-in ticket. The ticket still has to be
	exchanged with `continueTallySignIn`.
	"""
	finishTallyPasskeyRegistration(ticket: String!, challengeId: String!, credentialJson: String!): Boolean!
	"""
	Exchange a sign-in ticket for the URL to send the browser back to the app
	with, as `completeTallySignIn` returns. Uses the ticket up.
	"""
	continueTallySignIn(ticket: String!): String!
	"""
	Sign in to Tally with a passkey: verify the assertion for a challenge from
	`beginPasskeyLogin` and authorize the app that opened the sign-in page as the
	passkey's owner, returning the URL to send the browser to as
	`completeTallySignIn` does. A user's passkey signs in as the member that
	user's email would.
	"""
	completeTallyPasskeySignIn(challengeId: String!, credentialJson: String!, request: TallyAuthorizationInput!): String!
	"""
	Request an email login code. Always returns true to avoid email enumeration.
	Requires a valid Cloudflare Turnstile token.
	"""
	requestAuthCode(email: String!, turnstileToken: String!): Boolean!
	"""
	Verify an email login code and return an opaque session token on success.
	"""
	verifyAuthCode(email: String!, code: String!): String
	"""
	Revoke the current user's opaque session token (no-op when not signed in with one).
	"""
	logout: Boolean!
	createUser(		email: String!,		isSuper: Boolean!,
		"""
		Locations where the user is an Admin (read and write).
		"""
		locationGrants: [String!]!,
		"""
		Locations where the user is Read only: can view but not change. Must not overlap `locationGrants`. Omitted means none.
		"""
		readOnlyLocationGrants: [String!]
	): User!
	updateUser(		id: ID!,		email: String!,		isSuper: Boolean!,		isDev: Boolean!,		enabled: Boolean!,
		"""
		Locations where the user is an Admin (read and write).
		"""
		locationGrants: [String!]!,
		"""
		Locations where the user is Read only: can view but not change. Must not overlap `locationGrants`. Omitted leaves the user's existing read-only locations unchanged.
		"""
		readOnlyLocationGrants: [String!]
	): User!
	"""
	Set the member a user acts as when signing in or out from the mobile app, or
	clear it with a null `personId`. Any user may be given any member, the super
	user themselves included, and several users may share one member.
	"""
	setUserMember(		userId: ID!,
		"""
		The member to act as; null clears the link.
		"""
		personId: ID
	): User!
	createPerson(locationId: ID!, firstName: String!, lastName: String!, memberNumber: String!): Person!
	updatePerson(id: ID!, firstName: String!, lastName: String!, memberNumber: String!): Person!
	deletePerson(id: ID!): Boolean!
	createPeriod(personId: ID!, locationId: ID!, categoryId: ID!, startTime: Int!, endTime: Int!, comment: String): Period!
	updatePeriod(id: ID!, personId: ID!, locationId: ID!, categoryId: ID!, startTime: Int!, endTime: Int!, comment: String): Period!
	updatePeriodTimeCategory(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!, comment: String): Period!
	"""
	Admin edit of a guest (non-member) period: name, times, and comment.
	A guest period has no person and no category, so those are never touched
	here — member periods go through `update_period` /
	`update_period_time_category`, which reject guests.
	"""
	updateGuestPeriod(id: ID!, guestName: String!, startTime: Int!, endTime: Int!, comment: String): Period!
	"""
	Email the member a reminder to check one of their time entries, with a
	short-lived link that lets them correct it themselves.
	
	Issues a fresh `slp_` token each time, so a member who lost or expired an
	earlier link just needs another press. Returns the address it was sent to
	(useful confirmation for the admin who pressed the button).
	"""
	sendPeriodEditLink(id: ID!): String!
	deletePeriod(id: ID!): Boolean!
	"""
	Complete a public-key kiosk enrollment: create a session bound to the public key a
	kiosk previously published via [`submit_enrollment_key`], identified by its
	`key_fingerprint`. The kiosk then authenticates every request by signing it.
	Reached from the admin SessionEnroll page after scanning
	the kiosk's QR code.
	
	Works whatever state the device's current enrollment is in — live, expired, or
	deleted. Any session still holding the key has it released (`key_released_at`
	stamped, key material dropped) before the new one takes it, so a kiosk set up as
	the wrong kiosk, or at the wrong location, is fixed by re-enrolling the device
	itself. The released record stays listed at its own location so the admins there
	can see the kiosk was replaced; nothing about it is reported back to the caller,
	who may have no access to that location.
	"""
	enrollSession(name: String!, locationId: ID!, config: String, healthcheckUrl: String, keyFingerprint: String!): Session!
	createApiToken(name: String!, locationGrants: [String!]!, readOnly: Boolean!, expiresAt: Int): CreateApiTokenResult!
	updateApiToken(id: ID!, name: String!, locationGrants: [String!]!, readOnly: Boolean!, expiresAt: Int): ApiToken!
	revokeApiToken(id: ID!): Boolean!
	updateSession(id: ID!, name: String!, config: String, healthcheckUrl: String): Session!
	"""
	Rename one of the passkeys that sign the signed-in member in to Tally
	(`TallyViewer.passkeys`). Tally members only; anyone else's passkey is
	`NOT_FOUND`.
	"""
	renameTallyPasskey(id: ID!, name: String!): TallyPasskey!
	"""
	Delete one of the passkeys that sign the signed-in member in to Tally
	(`TallyViewer.passkeys`). A user's passkey then no longer signs in to the
	SESLogin site either. Returns its ID. Tally members only; anyone else's
	passkey is `NOT_FOUND`.
	"""
	deleteTallyPasskey(id: ID!): ID!
	"""
	Sign one of the member's devices out of Tally (`TallyViewer.signIns`): its
	grant is deleted, so it can't refresh, and its access token stops working.
	This device's own may be revoked too. Returns its ID. Tally members only;
	anyone else's sign-in is `NOT_FOUND`.
	"""
	revokeTallySignIn(id: ID!): ID!
	"""
	A single-use, 10-minute ticket for adding a passkey from Tally: Tally opens
	`/tally/passkey#<ticket>` on its SESLogin site, which confirms an email with
	a code (`sendTallyPasskeySetupCode`, `verifyTallyPasskeySetupCode`) and then
	saves the passkey with `beginTallyPasskeySetup` and `finishTallyPasskeySetup`.
	The passkey is the SESLogin user's when the confirmed email is an enabled
	user's, else the member's own. Tally members only.
	"""
	startTallyPasskeySetup: String!
	"""
	Email a Tally sign-in code to `email` for a ticket from
	`startTallyPasskeySetup`, if that email signs in as the ticket's member.
	Always `true` for a live ticket, so the answer says nothing about the email;
	`BAD_REQUEST` once the ticket has expired, been used, or its Tally sign-in has
	been revoked.
	"""
	sendTallyPasskeySetupCode(ticket: String!, email: String!): Boolean!
	"""
	Confirm the email for a passkey setup ticket with the code
	`sendTallyPasskeySetupCode` sent. `BAD_REQUEST` for a wrong, expired or
	used-up code.
	"""
	verifyTallyPasskeySetupCode(ticket: String!, email: String!, code: String!): Boolean!
	"""
	Start saving a passkey with a ticket from `startTallyPasskeySetup`, once its
	email is confirmed (`BAD_REQUEST` before). Returns
	the options for `navigator.credentials.create`. The ticket is the
	authority; `BAD_REQUEST` once it has expired, been used, or its Tally
	sign-in has been revoked.
	"""
	beginTallyPasskeySetup(ticket: String!): PasskeyChallenge!
	"""
	Finish saving a passkey with a ticket from `startTallyPasskeySetup`. Uses
	the ticket up and returns the URL to send the browser back to Tally with.
	"""
	finishTallyPasskeySetup(ticket: String!, challengeId: String!, credentialJson: String!): String!
	"""
	Start uploading a JPEG or WebP image from Tally: creates a pending asset and
	returns a form to POST the file to (fields in order, then the file as a part
	named `file` last). Call `completeAssetUpload` once it is posted. Fails
	`RATE_LIMITED` after 200 uploads in a Sydney day, and `BAD_REQUEST` for a file
	type or size that isn't accepted or on an environment with no upload storage.
	"""
	createAssetUpload(input: CreateAssetUploadInput!): AssetUpload!
	"""
	Check the file arrived intact and make the asset ready. Completing an asset that
	is already ready returns it. `BAD_REQUEST` if the file hasn't arrived or isn't
	the image that was described.
	"""
	completeAssetUpload(id: ID!): Asset!
	"""
	Add a ready image the caller uploaded to a unit's photo stream. `NOT_FOUND` for
	an unknown asset, `BAD_REQUEST` if it isn't complete or belongs to another unit,
	`FORBIDDEN` if someone else uploaded it, `RATE_LIMITED` after 100 photos at the
	unit in a Sydney day.
	"""
	createPhoto(locationId: ID!, assetId: ID!): Photo!
	"""
	Remove a photo from the stream for everyone now; it is deleted within seven days.
	There is no undo. `NOT_FOUND` if it is unknown or already hidden.
	"""
	hidePhoto(id: ID!): Photo!
	"""
	Mark some of your notifications read (at most 200 IDs). One that is already read,
	or is not yours, is ignored. Returns how many you still have unread.
	"""
	markNotificationsRead(ids: [ID!]!): MarkNotificationsReadPayload!
	"""
	Mark all your notifications read. Returns how many you still have unread (usually
	none).
	"""
	markAllNotificationsRead: MarkNotificationsReadPayload!
	deleteSession(id: ID!): Boolean!
	"""
	Bring back a QR-enrolled kiosk that expired after two weeks offline, without
	deleting and re-enrolling it — it keeps its name, config and healthcheck URL.
	
	Only succeeds while the kiosk is switched on and showing its enrollment QR screen,
	and only grants a short window: the kiosk must come back with one signed request,
	which restores its normal two-week window. Otherwise the grant simply lapses.
	"""
	reactivateSession(id: ID!): Session!
	createLocation(name: String!, nitcEnabled: Int): Location!
	updateLocation(id: ID!, name: String!, enabled: Boolean!, nitcEnabled: Int, nitcCompleteOnExport: Boolean, gamificationEnabled: Boolean, badgeEmailsEnabled: Boolean): Location!
	createCategory(		name: String!,		isVirtual: Boolean!,		nitcGroupId: String,		nitcParticipantType: String,
		"""
		Kiosk group the category appears under, e.g. "Training".
		"""
		groupName: String,
		"""
		Short name the kiosk shows, e.g. "AIIMS".
		"""
		shortName: String,
		"""
		Kiosk icon name, e.g. "aiims".
		"""
		icon: String
	): Category!
	updateCategory(		id: ID!,		name: String!,		enabled: Boolean!,		isVirtual: Boolean!,		nitcGroupId: String,		nitcParticipantType: String,
		"""
		Kiosk group name. Omit to leave unchanged, null (or empty) to clear, or a string to set.
		"""
		groupName: String,
		"""
		Short display name. Omit to leave unchanged, null (or empty) to clear, or a string to set.
		"""
		shortName: String,
		"""
		Icon name. Omit to leave unchanged, null (or empty) to clear, or a string to set.
		"""
		icon: String
	): Category!
	createNitcGroup(id: String, nitcType: String!, nitcTagIds: [Int!]!): NitcGroup!
	updateNitcGroup(id: ID!, nitcType: String!, nitcTagIds: [Int!]!): NitcGroup!
	deleteNitcGroup(id: ID!): Boolean!
	scanRegister2(		memberNumber: String!,
		"""
		Also compute the sign-out quick-pick shortcuts (see RegisterResult.quickPick). Opt-in: it costs extra reads, and a kiosk with the quick-pick screen turned off has no use for them.
		"""
		quickPick: Boolean,
		"""
		Before signing in a member who doesn't belong to this kiosk's location (not their primary unit or one of their other units), return `CONFIRM_VISITOR` instead and write nothing, so the kiosk can check a mistyped number isn't about to sign in the wrong person. The kiosk repeats the call without it once they confirm. Has no effect on a sign-out, which shows the member's name before anything is written.
		"""
		confirmVisitor: Boolean
	): RegisterResult!
	"""
	Start signing out one specific open member period, picked from the kiosk's
	signed-in list rather than by scanning a member number. Returns the same
	`SIGN_OUT_PENDING` result as `scanRegister2`, so the kiosk carries on to
	`scanSignOut` exactly as after a scan.
	
	Unlike `scanRegister2` this never signs anyone in, and it acts on the period
	named rather than the person's newest open one. A row the kiosk shows from a
	stale list is refused instead: `NOT_FOUND` when the period is gone or deleted,
	`CONFLICT` when it is already signed out, `BAD_REQUEST` for a guest period
	(which `scanGuestSignOut` closes). Nothing is written.
	"""
	scanStartSignOut(		id: ID!,
		"""
		As for `scanRegister2`'s `quickPick`.
		"""
		quickPick: Boolean
	): RegisterResult!
	scanSignOut(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!): Period!
	"""
	`scanSignOut` for a kiosk that celebrates badges: the same sign-out, plus the
	badges the member has earned and not yet seen. Empty unless the kiosk, its
	location and at least one of the member's units all have gamification on.
	"""
	scanSignOutWithBadges(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!): ScanSignOutResult!
	"""
	Sign the member signed in to Tally in at a unit, as typing their member number at
	a kiosk there would: their primary unit, or `locationId` when given, which must be a
	unit they can use in Tally (`FORBIDDEN` otherwise; any unit they belong to
	qualifies). Idempotent: if the member is
	already signed in at that unit, that period is returned unchanged, so a double tap
	never opens two. A period open at another unit is ignored. Tally members only,
	and no location grant is needed at any unit they belong to (being the member is the authority).
	"""
	selfSignIn(locationId: ID): Period!
	"""
	Sign the member out of one of their own open periods, at whichever unit, as
	`scanSignOut` does at a kiosk. `expectedVersion` is the period's `version` as
	the app last saw it; if it, or the sign-in, has changed since (e.g. a kiosk
	signed them out first) the write is refused with `CONFLICT` and nothing changes.
	The end cannot be more than a minute in the future, and the category must exist
	and be enabled. Times are Unix seconds.
	"""
	selfSignOut(id: ID!, expectedVersion: Int!, startTime: Int!, endTime: Int!, categoryId: ID!): Period!
	"""
	Sign in a guest (non-member) at the kiosk. Creates an open period with no
	person and no category, so it never enters per-person views or the NITC export.
	"""
	scanGuestSignIn(name: String!, reason: String): Period!
	"""
	Sign out a guest period from the kiosk. Only closes guest periods (no person,
	no category), so it can never be used to close a member period.
	"""
	scanGuestSignOut(id: ID!): Period!
	enqueueMemberSync(locationId: ID!): Boolean!
	"""
	Send feedback or a help request to the SESLogin team, as a ticket in
	Toolbox. Replies go to the caller's own email address, which is read from
	their user record — never from the request — because Toolbox trusts it as
	already verified. Fails when feedback isn't configured on this server (see
	`Query.feedbackAvailable`).
	"""
	submitFeedback(subject: String!, message: String!): SubmittedFeedback!
	updateMyEmailConfig(dailyLocationIds: [String!]!, weeklyBadgeLocationIds: [String!], dailyChangesLocationIds: [String!]): User!
	updateMyDisaggregateVirtualPeriods(value: Boolean!): User!
	"""
	Start passkey registration for the authenticated user.
	Returns a JSON challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyRegistration: PasskeyChallenge!
	"""
	Finish passkey registration: verify the browser response and store the credential.
	"""
	finishPasskeyRegistration(challengeId: String!, credentialJson: String!, name: String!): PasskeyInfo!
	"""
	Start a discoverable passkey login (no username required).
	Returns a JSON challenge to pass to the browser's WebAuthn API.
	"""
	beginPasskeyLogin: PasskeyChallenge!
	"""
	Finish passkey login: verify the browser response and return an opaque session token.
	"""
	finishPasskeyLogin(challengeId: String!, credentialJson: String!): String
	"""
	Rename one of the authenticated user's passkeys.
	"""
	renamePasskey(id: String!, name: String!): PasskeyInfo!
	"""
	Delete one of the authenticated user's passkeys.
	"""
	deletePasskey(id: String!): Boolean!
	"""
	Approve an OAuth authorization request: the user has seen the consent
	screen (`oauthAuthorizationRequest`) and clicked "Approve". Mints a
	single-use authorization code and returns the client's `redirect_uri`
	with `code` (and `state`, if given) appended — the caller just navigates
	there.
	
	Re-validates the client id and redirect URI itself rather than trusting
	whatever the consent page last read: nothing stops a client from calling
	this directly, so every check the query made is repeated here.
	"""
	approveOauthAuthorization(clientId: String!, redirectUri: String!, codeChallenge: String!, codeChallengeMethod: String!, scope: String, resource: String, state: String): String!
	"""
	Revoke a "connected app". Callers may revoke their own grants; a
	super user may also revoke anyone's. Anything else — including a grant
	that doesn't exist — fails the same "not found" way, so a caller can't
	probe for other users' grant IDs.
	"""
	revokeOauthGrant(id: ID!): Boolean!
}

