	"""
	`scanSignOut` for a kiosk that celebrates badges: the same sign-out, plus the
	badges the member has earned and not yet seen. Empty unless the kiosk, its
	location and the member's home location all have gamification on.
	"""
	scanSignOutWithBadges(id: ID!, startTime: Int!, endTime: Int!, categoryId: ID!): ScanSignOutResult!
	"""
	Sign the signed-in user's linked member in at their home unit, as typing their
	member number at a kiosk there would, for the Tally app. Idempotent: if the
	member is already signed in at home, that period is returned unchanged, so a
	double tap never opens two. A period open at another unit is ignored. Users
	only, and no location grant is needed (the member link is the authority).
	"""
	selfSignIn: Period!
	"""
	Sign the linked member out of one of their own open home-unit periods, as
	`scanSignOut` does at a kiosk. `expectedVersion` is the period's `version` as
	the app last saw it; if it, or the sign-in, has changed since (e.g. a kiosk
	signed them out first) the write is refused with `CONFLICT` and nothing changes.
	The end cannot be more than a minute in the future, and the category must exist
	and be enabled. Times are Unix seconds.
	"""
	selfSignOut(id: ID!, expectedVersion: Int!, startTime: Int!, endTime: Int!, categoryId: ID!): Period!
	"""
	Sign in a guest (non-member) at the kiosk. Creates an open period with no
	person and no category, so it never enters per-person views or the NITC export.
	"""
	scanGuestSignIn(name: String!, reason: String): Period!
	"""
	Sign out a guest period from the kiosk. Only closes guest periods (no person,
	no category), so it can never be used to close a member period.
	"""
	scanGuestSignOut(id: ID!): Period!
	enqueueMemberSync(locationId: ID!): Boolean!
	"""
	Send feedback or a help request to the SESLogin team, as a ticket in
	Toolbox. Replies go to the caller's own email address, which is read from
	their user record — never from the request — because Toolbox trusts it as
	already verified. Fails when feedback isn't configured on this server (see
	`Query.feedbackAvailable`).
