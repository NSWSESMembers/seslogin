"""
What the OAuth consent screen needs to show before a user approves or denies
an authorization request: the client's name, and — the one value that
actually matters for a dynamically registered client, whose name is
self-claimed — the host it will redirect back to.
"""
type OauthAuthorizationRequest {
	clientName: String!
	"""
	Host of the redirect URI. Meaningless for a first-party app's custom
	scheme (`tally://oauth/callback` gives `oauth`), so show
	`isFirstParty` instead when it's true.
	"""
	redirectHost: String!
	"""
	One of SESLogin's own apps (`oauth_clients::STATIC_CLIENTS`), whose name
	and redirect are fixed in code, rather than a self-registered client.
	"""
	isFirstParty: Boolean!
	"""
	A development build of a first-party app, redirecting to the Expo server
	on a developer's machine (`redirectHost`, with its port). Only a developer
	account gets this far; anyone else is refused.
	"""
	isDevelopmentBuild: Boolean!
}

type OauthGrant {
	id: ID!
	clientName: String!
	"""
	Host the client's tokens redirect back to. Shown instead of the
	(unauthenticated, self-claimed) client name alone, same as on the
	consent screen. Meaningless when `isFirstParty`, so show that instead.
	"""
	redirectHost: String!
	"""
	Granted to one of SESLogin's own apps (`oauth_clients::STATIC_CLIENTS`)
	at one of its registered redirects. False for a self-registered client,
	and for a development build's grant, which shows its address instead.
	"""
	isFirstParty: Boolean!
	scope: String!
	createdAt: Int!
	lastUsedAt: Int
	"""
	When this grant's refresh token stops working if it's never used
	again. Sliding: it moves out on every refresh, up to `expires_at`
	(the grant's absolute cap, not exposed here since it isn't a useful
	signal to show — a grant in active use never approaches it).
	"""
	refreshExpiresAt: Int!
}

type OnCallRole {
	id: ID!
	"""
	One line, e.g. "Duty Officer".
	"""
	name: String!
	"""
	What the role is for, plain text; empty when there is none.
	"""
	description: String!
	"""
	A number that reaches whoever holds the role, e.g. a duty phone that diverts to
	them; null when there is none. Kept as the unit wrote it.
	"""
	phone: String
	locationId: ID!
	location: Location!
	"""
	Who is on call in the role now; null when nobody is, or when the primary has
	since been deleted.
	"""
	primary: Person
	"""
	Everyone else in the role now, by name. Deleted people are left out.
	"""
	secondaries: [Person!]!
	"""
	When the people in the role last changed (Unix seconds); null while nobody is
	in it.
	"""
	membersChangedAt: Int
	"""
	Bumped by every change; pass it back to `updateOnCallRole`.
	"""
	version: Int!
	createdAt: Int!
	"""
	Email of the user who created the role.
	"""
	createdBy: String
	updatedAt: Int!
	"""
	Email of the user who last changed the role.
	"""
	updatedBy: String
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
