"""
An Ably `TokenRequest`, signed server-side, that a kiosk can hand straight
to ably-js's `authCallback` to authenticate for its own channel — see
`kioskRealtimeToken` and `enrollmentRealtimeToken`. Field names and shapes mirror Ably's own wire format
(<https://ably.com/docs/api/rest-api#token-request-spec>) so no translation
is needed on the client.

`timestamp` is a `Float`, not an `Int`: GraphQL's `Int` is 32-bit, and a
Unix-epoch-*milliseconds* timestamp doesn't fit. `ttl` (a fixed one hour in
milliseconds) does fit comfortably and stays an `Int`.
"""
type AblyTokenRequest {
	keyName: String!
	ttl: Int!
	capability: String!
	clientId: String!
	timestamp: Float!
	nonce: String!
	mac: String!
}

type ApiToken {
	id: ID!
	name: String!
	locationGrants: [String!]!
	readOnly: Boolean!
	createdAt: Int!
	createdByUserId: ID!
	expiresAt: Int
	revokedAt: Int
	lastUsedAt: Int
}

type Asset {
	id: ID!
	"""
	`"image"`.
	"""
	kind: String!
	contentType: String!
	byteSize: Int!
	width: Int
	height: Int
	"""
	Unix seconds, from the original's metadata as the phone read it.
	"""
	takenAt: Int
	createdAt: Int!
	"""
	Person ID of the member who uploaded it.
	"""
	createdBy: ID
	"""
	Whether the upload has been completed and the image can be shown.
	"""
	ready: Boolean!
	"""
	A relative `/media/...` URL for the image at `variant` (a normalised WebP), valid
	for at least a day; null until the asset is ready.
	"""
	url(variant: ImageVariant!): String
}

type AssetUpload {
	"""
	The pending asset; pass its ID to `completeAssetUpload` once the file is posted.
	"""
	asset: Asset!
	"""
	May be relative: resolve it against the API origin.
	"""
	uploadUrl: String!
	fields: [UploadField!]!
	"""
	Unix seconds after which the form stops working.
	"""
	expiresAt: Int!
}

"""
What a recorded write did to its entity.
"""
enum AuditAction {
	CREATE
	UPDATE
	DELETE
	RESTORE
}

type AuditActor {
	kind: AuditActorKind!
	"""
	The actor's ID: a user, member, kiosk session or API token ID, the period ID of an edit
	link, or the job name for `SYSTEM` (`member-sync`, `cli`, …). Null when none was
	recorded.
	"""
	id: String
	"""
	How a user acted when not through an ordinary web login: `oauth_grant:<id>` (a
	connected app: an AI client over MCP, or one of SESLogin's own apps over
	GraphQL), `user_token:<id>` or `oauth_client:<id>`. Super users only;
	null for everyone else.
	"""
	via: String
	"""
	A name for the actor, looked up now rather than recorded: a user's email, a member's
	name, a kiosk's
	name, an API token's name, the job name for `SYSTEM`, "Period edit link" for an
	edit link. Null when there is nothing to show or the record no longer exists.
	"""
	label: String
}

"""
Who made a write.
"""
enum AuditActorKind {
	"""
	A signed-in user (web, MCP or a user token).
	"""
	USER
	"""
	A member signed in to Tally.
	"""
	MEMBER
	"""
	A kiosk device.
	"""
	SESSION
	API_TOKEN
	"""
	A member using a single-period edit link.
	"""
	PERIOD_LINK
	"""
	A background job or the CLI.
	"""
	SYSTEM
	"""
	A write made before anyone was identified (e.g. the first login code request).
	"""
	UNAUTHENTICATED
	"""
	Not recorded, or a kind this server version does not know.
	"""
	UNKNOWN
}

"""
The kind of record an entry is about.
"""
enum AuditEntityType {
	USER
	PERSON
	PERIOD
	SESSION
	API_TOKEN
	LOCATION
	CATEGORY
	NITC_GROUP
	NITC_TAG
	USER_TOKEN
	OAUTH_GRANT
	WEBAUTHN_CREDENTIAL
	TASK
	TASK_LIST
	NOTE
	NOTE_FOLDER
	EQUIPMENT
	EQUIPMENT_LOG_ENTRY
	EQUIPMENT_RESERVATION
	ON_CALL_ROLE
	SHARED_CONTACT
	MAP_PIN
	MAP_LAYER
	CALENDAR
	CALENDAR_EVENT
	LOCATION_SHARE
	ASSET
	PHOTO
	MEETING
	AGENDA_ITEM
}

type AuditEntry {
	"""
	Unique per entry *in a view*. A write that touched two locations is two entries
	(one in each location's log) with different IDs.
	"""
	id: ID!
	"""
	When the write happened, in Unix seconds.
	"""
	timestamp: Int!
	action: AuditAction!
	entityType: AuditEntityType!
	"""
	The ID of the record that was changed.
	"""
	entityId: ID!
	"""
	A human-readable name for the record as it was at the time (e.g. a member's full
	name), so the entry still reads sensibly after the record is renamed or deleted.
	"""
	entityLabel: String
	"""
	The location this entry belongs to. In a location's log, that location. In the
	all-locations view, the first location the write touched (a write that moved a
	member between units appears once there). Null for a global record (user,
	category, …) and if the location no longer exists.
	"""
	location: Location
	actor: AuditActor!
	"""
	The client IP address of the request. Super users only; null for everyone else,
	because an IP address is personal data.
	"""
	ip: String
	"""
	The fields the write changed, before and after. Empty when the write has no
	field-level detail to show.
	"""
	changes: [AuditFieldChange!]!
}

type AuditEntryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [AuditEntryEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [AuditEntry!]!
}

"""
An edge in a connection.
"""
type AuditEntryEdge {
	"""
	The item at the end of the edge
	"""
	node: AuditEntry!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
One field a write changed.
"""
type AuditFieldChange {
	"""
	The field's name as stored, e.g. `first_name`.
	"""
	field: String!
	"""
	The value before the write, or null if the field was absent (or the entity was just
	created). A JSON string is returned as its raw text, anything else as compact JSON
	(`true`, `42`, `["a","b"]`), so the text `5` is a string or a number — a viewer that
	cares can tell from the field. A secret that changed shows as `[redacted]`.
	"""
	before: String
	"""
	The value after the write, or null if the field was removed. Same encoding as
	`before`.
	"""
	after: String
}

