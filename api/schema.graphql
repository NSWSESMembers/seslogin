type Equipment {
	id: ID!
	type: EquipmentType!
	"""
	One line of plain text.
	"""
	name: String!
	"""
	Plain text; empty when there is none.
	"""
	description: String!
	status: EquipmentStatus!
	"""
	When the status last changed, or the equipment was added.
	"""
	statusChangedAt: Int!
	"""
	When someone last logged a check of it; null if nobody has.
	"""
	lastCheckedAt: Int
	"""
	Its status changes and checks, newest first. Every status change has a comment
	saying why.
	"""
	log: [EquipmentLogEntry!]!
	locationId: ID!
	location: Location!
	"""
	Bumped by every edit (not by log entries); pass it back to `updateEquipment`.
	"""
	version: Int!
	createdAt: Int!
	"""
	Email of the user who added it.
	"""
	createdBy: String
	updatedAt: Int!
	"""
	Email of the user who last edited it.
	"""
	updatedBy: String
}

type EquipmentLogEntry {
	id: ID!
	kind: EquipmentLogKind!
	"""
	The status before a change. Null for checks, and for the entry written when the
	equipment was added.
	"""
	previousStatus: EquipmentStatus
	"""
	The status after a change, or the status it was in when checked.
	"""
	status: EquipmentStatus!
	"""
	Why, in the words of whoever made the entry. May be empty for a check, or for
	the entry written when the equipment was added.
	"""
	comment: String!
	createdAt: Int!
	"""
	Email of the user who made the entry.
	"""
	createdBy: String
}

enum EquipmentLogKind {
	"""
	The status changed (or, with no `previousStatus`, the equipment was added).
	"""
	STATUS_CHANGE
	"""
	Someone checked the equipment; the status did not change.
	"""
	CHECK
}

type EquipmentReservation {
	id: ID!
	"""
	Unix seconds.
	"""
	startTime: Int!
	"""
	Unix seconds; always after `startTime`.
	"""
	endTime: Int!
	"""
	Every piece of equipment reserved, deleted ones included.
	"""
	equipmentIds: [ID!]!
	"""
	The equipment reserved, by name. Equipment deleted since is left out, so this
	can be empty.
	"""
	equipment: [Equipment!]!
	"""
	Who it is for, to show: `reservedForText` when set, otherwise the name of the
	member the user's account is linked to, or their email.
	"""
	reservedFor: String!
	"""
	The user it is for; null when it is for someone named in `reservedForText`.
	"""
	reservedForUserId: ID
	"""
	Free text naming who it is for: someone else, an organisation, or something
	like "Detailing / clean". Null when it is for a user.
	"""
	reservedForText: String
	"""
	Whether it is for the user asking.
	"""
	reservedForViewer: Boolean!
	"""
	Plain text; empty when there is none.
	"""
	description: String!
	"""
	The location's other reservations that overlap this one in time and share a
	piece of equipment with it, by start time. Allowed, but worth a warning. Costs a
	query per reservation, so a client listing many should compare them itself.
	"""
	conflicts: [EquipmentReservation!]!
	locationId: ID!
	location: Location!
	"""
	Bumped by every change; pass it back to `updateEquipmentReservation`.
	"""
	version: Int!
	createdAt: Int!
	"""
	Email of the user who made the reservation.
	"""
	createdBy: String
	updatedAt: Int!
	"""
	Email of the user who last changed it.
	"""
	updatedBy: String
}

enum EquipmentStatus {
	IN_SERVICE
	OUT_OF_SERVICE
	MISSING
	BORROWED
}

"""
What kind of thing a piece of equipment is. More types are expected, so clients
should cope with a value they don't know.
"""
enum EquipmentType {
	VEHICLE
	TRAILER
	VESSEL
	RADIO
	DEVICE
	BAG
	BOX
	TOOL
}

"""
How often an event repeats.
"""
enum EventRepeat {
	"""
	Every day.
	"""
	DAILY
	"""
	Every week, on the weekday it starts.
	"""
	WEEKLY
}

"""
A scalar that can represent any JSON value.
"""
scalar JSON

"""
A signed realtime token together with the exact channel it authorizes.
"""
type KioskRealtimeToken {
	"""
	The Ably channel this token authorizes: a location's period open/close
	events for `kioskRealtimeToken`, or a pending key's enrollment-completed
	signal for `enrollmentRealtimeToken`. Pass straight to `ably-js`'s
	`channels.get(channel)`.
	"""
	channel: String!
	"""
	The kiosk's own session channel, which the token also covers: it carries
	`session.updated` (an admin edit, with the new name and config) and
	`session.changed` (refetch the session). Null for `enrollmentRealtimeToken`.
	"""
	sessionChannel: String
	tokenRequest: AblyTokenRequest!
}

type Location {
	id: ID!
	name: String!
	enabled: Boolean!
	"""
	Whether the current caller may make changes at this location. False for Read
	only users, so a client can hide edit controls rather than let them fail.
	"""
	viewerCanEdit: Boolean!
	"""
	A record of changes made at this location — who changed what, and when — newest
	first. Visible to every user with access to the location, Admin or Read only (and
	super users); kiosks, API tokens and edit links are refused. A member moved between
	locations appears in the log of both. Global records (users, categories, …) are
	not here; they are in `Query.auditLog`, for super users.
	"""
	auditLog(		first: Int,		after: String,		last: Int,		before: String,
		"""
		Only entries about this kind of record
		"""
		entityType: AuditEntityType @deprecated(reason: "Use `entityTypes`"),
		"""
		Only entries about any of these kinds of record. Omitted or empty means every kind
		"""
		entityTypes: [AuditEntityType!]
	): AuditEntryConnection!
	nitcEnabled: Int
	"""
	Whether NITC events exported for this location are marked completed in SES.
	"""
	nitcCompleteOnExport: Boolean!
	"""
	Whether members of this location earn badges.
	"""
	gamificationEnabled: Boolean!
	sesApiHeadquartersId: String
	lastSuccessfulMemberSync: Int
	"""
	The unit's SES code. Users and API tokens with access to this location only.
	"""
	code: String
	"""
	Latitude from the SES API. Same access as `code`.
	"""
	latitude: Float
	"""
	Longitude from the SES API. Same access as `code`.
	"""
	longitude: Float
	"""
	The SES intranet directory entity this unit resolved to. Same access as `code`.
	"""
	sesDirectoryEntityId: String
	"""
	The unit's street address from the directory. Same access as `code`.
	"""
	address: LocationAddress
	"""
	The unit's postal address from the directory. Same access as `code`.
	"""
	postalAddress: LocationAddress
	"""
	The unit's contact email from the directory. Same access as `code`.
	"""
	email: String
	"""
	The unit's contact phone from the directory. Same access as `code`.
	"""
	phone: String
	"""
	The unit's rescue accreditations, sorted by type. Same access as `code`.
	"""
	accreditations: [LocationAccreditation!]!
	createdAt: Int!
	updatedAt: Int!
	people: [Person!]!
	periods(onlyActive: Boolean, startTime: Int, endTime: Int, categories: [ID!], after: String, before: String, first: Int, last: Int): PeriodConnection!
	periodSummaryByMember(startTime: Int!, endTime: Int!, categories: [ID!]): [MemberPeriodSummary!]!
	periodSummaryByCategory(startTime: Int!, endTime: Int!): [CategoryPeriodSummary!]!
	periodSummaryByMemberByCategory(startTime: Int!, endTime: Int!): [MemberCategoryPeriodSummary!]!
	periodSummaryByCategoryByMember(startTime: Int!, endTime: Int!): [CategoryMemberPeriodSummary!]!
	periodSummaryByDayByCategoryByMember(startTime: Int!, endTime: Int!): [DayCategoryPeriodSummary!]!
	"""
	Per-day, per-member activity for this location, used to power the
	attendance heatmap. Unlike `period_summary_by_day_by_category_by_member`,
	this counts every period regardless of whether it has a category, and
	counts still-open periods towards `period_count` (though not
	`total_time`) so an in-progress check-in still shows up as activity
	for today. Days are returned in ascending order (the natural order for
	a left-to-right time series), unlike the descending order used by the
	other day-bucketed resolver.
	"""
	periodSummaryByDayByMember(startTime: Int!, endTime: Int!, categories: [ID!]): [DayMemberPeriodSummary!]!
	"""
	The location's open tasks (its shared to-do list): by default those due now,
	overdue first. `listId` narrows to one of its task lists; without it every
	task at the location is listed, whichever list it is on. Users only (Admin
	or Read only); see `graphql::tasks`.
	"""
	tasks(view: TaskView! = DUE, listId: ID): [Task!]!
	"""
	The location's task lists, by name.
	"""
	taskLists: [TaskList!]!
	"""
	The location's notes (its shared notebook), most recently changed first.
	`folderId` narrows to one of its note folders; without it every note at the
	location is listed, whichever folder it is in. `search` keeps notes whose title
	contains it, ignoring case. Users only (Admin or Read only); see
	`graphql::notes`.
	"""
	notes(folderId: ID, search: String): [Note!]!
	"""
	The location's note folders, by name.
	"""
	noteFolders: [NoteFolder!]!
	"""
	The location's equipment register, by name. `search` keeps equipment whose name
	or description contains it, ignoring case. Users only (Admin or Read only); see
	`graphql::equipment`.
	"""
	equipment(search: String): [Equipment!]!
	"""
	The location's equipment reservations that end after `endingAfter` (Unix
	seconds, default now) — those still to come or under way — by start time.
	`equipmentId` narrows to reservations of one piece of equipment. Users only
	(Admin or Read only); see `graphql::reservations`.
	"""
	equipmentReservations(endingAfter: Int, equipmentId: ID): [EquipmentReservation!]!
	"""
	The location's reservations a reservation of `equipmentIds` from `startTime` to
	`endTime` would overlap, by start time, leaving out `excludeId` (the one being
	edited). Overlaps are allowed; this is so a client can warn before saving.
	"""
	equipmentReservationConflicts(equipmentIds: [ID!]!, startTime: Int!, endTime: Int!, excludeId: ID): [EquipmentReservation!]!
	"""
	The pins on the location's shared map, by title. `layerId` narrows to one of its
	map layers; without it every pin at the location is listed, whichever layer it is
	on. Users only (Admin or Read only); see `graphql::map`.
	"""
	mapPins(layerId: ID): [MapPin!]!
	"""
	The location's map layers, by name.
	"""
	mapLayers: [MapLayer!]!
	"""
	The location's calendars, by name. Users only (Admin or Read only); see
	`graphql::calendar`.
	"""
	calendars: [Calendar!]!
	"""
	Every occurrence of the location's events that overlaps `from`–`to` (Unix
	seconds, at most 400 days apart), repeats expanded, by start; at most 5,000.
	All-day occurrences are included when one of their dates overlaps the window in
	any time zone, so a client should check them against its own days. Events in
	every calendar, and in none, are listed: a client picking calendars filters on
	`event.calendarId`. Users only (Admin or Read only).
	"""
	calendarEvents(from: Int!, to: Int!): [CalendarEventOccurrence!]!
	"""
	The location's on-call roles (Duty Officer, …) and who holds each now, by name.
	Users only (Admin or Read only); see `graphql::on_call`.
	"""
	onCallRoles: [OnCallRole!]!
	sessions: [Session!]!
	dashboardSummary(asOf: Int): LocationDashboardSummary!
	badgeLeaderboard(limit: Int): [LocationBadgeLeaderboardEntry!]!
}

